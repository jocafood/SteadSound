name: steadsound
services:
  api:
    extends:
      file: backend/compose.yaml
      service: api
    build:
      context: ./backend
      target: runtime
  web:
    build:
      context: .
      args:
        VITE_SOUND_PROFILE: ${VITE_SOUND_PROFILE:-ambient}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    init: true
